<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Stationery Shop</title>
    <link rel="stylesheet" href="/style.css">
    
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo"><h2>StationeryShop</h2></div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/cart" class="active">Cart <span id="cart-count">(0)</span></a></li>
            <li><a href="/profile">Profile</a></li>
        </ul> 
    </nav>

    <main class="container cart-container">
        <!-- Left Side: Cart Items -->
        <div class="cart-items-section">
            <h2>Your Cart</h2>
            <!-- กล่องนี้จะให้ JavaScript ดึงสินค้ามาใส่ -->
            <div id="cartItemsContainer">
                <p>Your cart is empty</p>
            </div>
        </div>
        
        <!-- Right Side: Checkout Summary -->
        <div class="checkout-section">
            <h2>Order Summary</h2>
            <div class="summary-row">
                <span>Subtotal:</span>
                <span id="cartSubtotal">0 THB</span>
            </div>
            
            <hr class="divider">
            
            <div class="form-group">
                <label>Delivery Method</label>
                <select id="deliveryMethod">
                    <option value="Pick-up">Pick-up at Store</option>
                    <option value="Shipping">Shipping</option>
                </select>
            </div>

            <div class="form-group" id="addressGroup">
                <label>Shipping Address</label>
                <textarea id="shippingAddress" rows="3" placeholder="Enter your address..." style="resize: none;"></textarea>
            </div>

            <div class="form-group">
                <label>Use Points (You have <span id="cartUserPoints">0</span> points)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="pointsToUse" oninput="applyPointsDiscount()" placeholder="Enter points to use" min="0" style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <small id="discountResult" style="color: #28a745; font-weight: bold; display: none; margin-top: 5px;"></small>
            </div>

            <hr class="divider">
            
            <div class="summary-row total">
                <span>Total:</span>
                <span id="cartTotal">0 THB</span>
            </div>
            
            <button class="btn-submit" onclick="checkout()">Confirm Order</button>
        </div>
    </main>
    <script src="/script.js"></script>
</body>
</html>
