<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Stationery Shop</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo"><h2>StationeryShop</h2></div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/cart" class="active">Cart <span id="cart-count">(2)</span></a></li>
            <li><a href="/profile">Profile</a></li>
        </ul> 
    </nav>

    <main class="container cart-container">
        <!-- Left Side: Cart Items -->
        <div class="cart-items-section">
            <h2>Your Cart</h2>
            <div class="cart-item">
                <img src="/public/images/pen.jpg" alt="Pen" class="cart-img">
                <div class="cart-item-info">
                    <h4>Blue Ballpoint Pen (0.5mm)</h4>
                    <p>Price: 15 THB</p>
                </div>
                <div class="cart-item-actions">
                    <input type="number" value="2" min="1" class="qty-input">
                    <button class="btn-remove">Remove</button>
                </div>
            </div>
            <!-- Item 2 -->
            <div class="cart-item">
                <img src="./images/notebook.jpg" alt="Notebook" class="cart-img">
                <div class="cart-item-info">
                    <h4>A5 Ring Notebook</h4>
                    <p>Price: 45 THB</p>
                </div>
                <div class="cart-item-actions">
                    <input type="number" value="1" min="1" class="qty-input">
                    <button class="btn-remove">Remove</button>
                </div>
            </div>
        </div>

        <!-- Right Side: Checkout Summary -->
        <div class="checkout-section">
            <h2>Order Summary</h2>
            <div class="summary-row">
                <span>Subtotal:</span>
                <span>75 THB</span>
            </div>
            
            <hr class="divider">
            
            <div class="form-group">
                <label>Delivery Method</label>
                <select id="deliveryMethod">
                    <option value="pickup">Pick-up at Store</option>
                    <option value="shipping">Shipping</option>
                </select>
            </div>

            <div class="form-group" id="addressGroup">
                <label>Shipping Address</label>
                <textarea rows="3" placeholder="Enter your address..."></textarea>
            </div>

            <div class="form-group">
                <label>Use Points (You have 100 points)</label>
                <input type="number" placeholder="Enter points to use" min="0" max="100">
            </div>

            <hr class="divider">
            
            <div class="summary-row total">
                <span>Total:</span>
                <span>75 THB</span>
            </div>
            
            <button class="btn-submit">Confirm Order</button>
        </div>
    </main>
</body>
</html>
