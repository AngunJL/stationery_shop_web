<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Stationery Shop</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body style="background-color: #f4f7f6;">

    <!-- Navbar -->
    <nav class="navbar" style="background-color: #ffffff">
        <div class="logo"><h2 style="color:rgb(0, 0, 0);">StationeryShop</h2></div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/cart">Cart</a></li>
            <li><a href="/profile" style="color:#007bff; font-weight:bold;">Profile</a></li>
            <li><button onclick="logout()" style="background:#2f612b; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">Logout</button></li>
        </ul>
    </nav>

    <main class="container" style="max-width: 600px; margin: 40px auto; background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);">
        <h2 style="text-align:center; border-bottom: 2px solid #eee; padding-bottom: 10px;">My Profile</h2>
        
        <!-- แสดงแต้ม Points -->
        <div style="text-align:center; margin: 20px 0; padding: 20px; background: #e3f2fd; border-radius: 10px;">
            <p style="margin: 0; font-size: 18px; color: #555;">Current Points</p>
            <h1 style="margin: 5px 0 0 0; color: #0da146; font-size: 40px;"><span id="displayPoints">0</span> <span style="font-size: 20px;">Points</span></h1>
        </div>

        <!-- ฟอร์มแก้ไขข้อมูล -->
        <form id="profileForm" onsubmit="updateProfile(event)">
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <div style="flex:1;">
                    <label>First Name</label>
                    <input type="text" id="profFirstName" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
                </div>
                <div style="flex:1;">
                    <label>Last Name</label>
                    <input type="text" id="profLastName" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
                </div>
            </div>
            
            <div style="margin-bottom:15px;">
                <label>Email</label>
                <input type="email" id="profEmail" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
            </div>

            <div style="margin-bottom:15px;">
                <label>Phone Number</label>
                <input type="text" id="profPhone" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
            </div>

            <div style="margin-bottom:20px;">
                <label>Shipping Address</label>
            <textarea id="profAddress" rows="3" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px; resize: none;"></textarea>            </div>

            <button type="submit" style="width:100%; padding:12px; background:#28a745; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer;">Save Changes</button>
        </form>
        
        <hr style="margin: 40px 0 20px 0; border: 1px solid #eee;">
        
        <!-- ตารางประวัติการสั่งซื้อ -->
        <div class="order-history-section">
            <h2 style="margin-top: 0; color: #333;">Your Order History</h2>
            <table style="width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden;">
                <thead style="background-color: #343a40; color: white;">
                    <tr>
                        <th style="padding:15px;">Order ID</th>
                        <th style="padding:15px;">Date Ordered</th>
                        <th style="padding:15px;">Total Amount</th>
                        <th style="padding:15px;">Status</th>
                        <th style="padding:15px; text-align:center;">Details</th>
                    </tr>
                </thead>
                <tbody id="customerOrderTable">
                    <tr><td colspan="5" style="text-align:center; padding:20px;">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <div id="orderDetailModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center;">
    <div style="background:white; padding:30px; border-radius:10px; width:500px; max-height: 80vh; overflow-y: auto; position:relative;">
        <span onclick="document.getElementById('orderDetailModal').style.display='none'" style="position:absolute; top:10px; right:15px; cursor:pointer; font-size:24px; font-weight:bold;">&times;</span>
        <h2 style="margin-top:0;">Details Order #<span id="detailOrderIdText"></span></h2>
        <table style="width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left;">
            <thead style="background: #f8f9fa;">
                <tr>
                    <th style="padding:10px; border-bottom:2px solid #ddd;">Product</th>
                    <th style="padding:10px; border-bottom:2px solid #ddd;">Price</th>
                    <th style="padding:10px; border-bottom:2px solid #ddd;">Quantity</th>
                    <th style="padding:10px; border-bottom:2px solid #ddd;">Total</th>
                </tr>
            </thead>
            <tbody id="orderDetailTable"></tbody>
        </table>
    </div>
</div>
    <script src="/script.js"></script>
</body>
</html>
