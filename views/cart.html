<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Stationery Shop</title>
    <link rel="stylesheet" href="/style.css">
    
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo"><h2>StationeryShop</h2></div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/cart" class="active">Cart <span id="cart-count">(0)</span></a></li>
            <li><a href="/profile">Profile</a></li>
        </ul> 
    </nav>

    <main class="container cart-container">
        <!-- Left Side: Cart Items -->
        <div class="cart-items-section">
            <h2>Your Cart</h2>
            <!-- กล่องนี้จะให้ JavaScript ดึงสินค้ามาใส่ -->
            <div id="cartItemsContainer">
                <p>ตะกร้าสินค้าของคุณว่างเปล่า</p>
            </div>
        </div>

        <!-- Right Side: Checkout Summary -->
        <div class="checkout-section">
            <h2>Order Summary</h2>
            <div class="summary-row">
                <span>Subtotal:</span>
                <span id="cartSubtotal">0 THB</span>
            </div>
            
            <hr class="divider">
            
            <div class="form-group">
                <label>Delivery Method</label>
                <select id="deliveryMethod">
                    <option value="pickup">Pick-up at Store</option>
                    <option value="shipping">Shipping</option>
                </select>
            </div>

            <div class="form-group" id="addressGroup">
                <label>Shipping Address</label>
                <textarea rows="3" placeholder="Enter your address..."></textarea>
            </div>

            <div class="form-group">
                <label>Use Points (You have 100 points)</label>
                <input type="number" placeholder="Enter points to use" min="0" max="100">
            </div>

            <hr class="divider">
            
            <div class="summary-row total">
                <span>Total:</span>
                <span id="cartTotal">0 THB</span>
            </div>
            
            <button class="btn-submit" onclick="checkout()">Confirm Order</button>
        </div>
    </main>
    <script src="/script.js"></script>
</body>
</html>
